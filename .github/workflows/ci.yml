name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test and build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

      - name: Build wheel
        run: uv build

      - name: Install wheel and smoke import
        run: |
          pip install dist/*.whl
          python -c "from mcpbundles_mcp_connect import McpbundlesConnectProvider, mcpbundles_fastmcp"
