name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Build wheel
        run: uv build

      - name: Install wheel and smoke import
        run: |
          pip install dist/*.whl
          python -c "from mcpbundles_mcp_connect import McpbundlesConnectProvider, mcpbundles_fastmcp"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/mcpbundles-mcp-connect
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

# PyPI trusted publishing setup (one-time — do BEFORE tagging v0.1.0):
# 1. Register PyPI project `mcpbundles-mcp-connect` (first upload creates it, OR add
#    a "pending publisher" at https://pypi.org/manage/account/publishing/ before tagging).
# 2. GitHub environment `pypi` on thinkchainai/mcpbundles-mcp-connect (created).
# 3. PyPI → Publishing → Add trusted publisher:
#    Owner: thinkchainai | Repository: mcpbundles-mcp-connect
#    Workflow: release.yml | Environment: pypi
# 4. Only then tag v0.1.0 — publish will fail until steps 1–3 are done.


